name: Terraform Dev Infrastructure

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "microservice_infrastructure/environment/dev/**"
      - "microservice_infrastructure/modules/**"
      - ".github/workflows/terraform-dev.yml"

  pull_request:
    branches:
      - main
    paths:
      - "microservice_infrastructure/environment/dev/**"
      - "microservice_infrastructure/modules/**"

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: microservice_infrastructure/environment/dev

jobs:
  terraform:
    name: Terraform CI/CD Dev
    runs-on: ubuntu-latest

    # Future ready (environment approvals & secrets)
    environment: dev

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Terraform Format
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Terraform Init
      - name: Terraform Init
        run: terraform init

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Install TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # Run TFLint
      - name: Run TFLint
        run: |
          tflint --init
          tflint

      # Run tfsec
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3

      # Run Checkov
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}

      # Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Upload Plan
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

      # Terraform Apply ONLY on main branch
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
